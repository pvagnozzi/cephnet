[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cephnet"
version = "0.1.0"
description = "Cephalometric landmark detection — training subsystem"
authors = [{name = "Piergiorgio Vagnozzi", email = "piergiorgio.vagnozzi@example.com"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "numpy>=1.26.0",
    "pillow>=10.2.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
    "click>=8.1.7",
    "albumentations>=1.3.1",
    "opencv-python-headless>=4.9.0",
    "pandas>=2.2.0",
    "matplotlib>=3.8.0",
    "scipy>=1.12.0",
    "tqdm>=4.66.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "types-PyYAML>=6.0.12",
    "types-tqdm>=4.66.0",
    "types-requests>=2.31.0",
]

[project.scripts]
cephnet = "cephnet.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cephnet"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "scripts/python"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "ANN", "B", "C4", "PT", "RET", "SIM"]
ignore = ["ANN101", "ANN102", "ANN401"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m not slow')",
    "gpu: marks tests requiring GPU",
]
