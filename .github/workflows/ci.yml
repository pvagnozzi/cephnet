# Last modified: 2026-04-19
# Description: CI workflow — lint, type-check and unit tests on every push/PR.

name: 🔄 CI

on:
  push:
    branches:
      - dev
      - main
      - 'feature/**'
      - 'hotfix/**'
      - 'release/**'
  pull_request:
    branches:
      - dev
      - main
      - 'release/**'

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1. GitVersion — compute semver from git history
  # ─────────────────────────────────────────────────────────────
  version:
    name: 🏷️ Compute Version
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.gitversion.outputs.semVer }}
      major:  ${{ steps.gitversion.outputs.major }}
      minor:  ${{ steps.gitversion.outputs.minor }}
      patch:  ${{ steps.gitversion.outputs.patch }}
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3.1.1
        with:
          versionSpec: '6.x'

      - name: Determine version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v3.1.1
        with:
          useConfigFile: true

      - name: 🖨️ Print version
        run: echo "🏷️ SemVer = ${{ steps.gitversion.outputs.semVer }}"

  # ─────────────────────────────────────────────────────────────
  # 2. Lint — ruff + mypy
  # ─────────────────────────────────────────────────────────────
  lint:
    name: 🎨 Lint & Type Check
    runs-on: ubuntu-latest
    needs: version
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Setup Python 3.11
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb # v5.4.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: 🔍 Ruff lint
        run: uv run ruff check src/

      - name: 🔍 Ruff format check
        run: uv run ruff format --check src/

      - name: 🔍 Mypy type check
        run: uv run mypy src/

  # ─────────────────────────────────────────────────────────────
  # 3. Test — pytest unit tests
  # ─────────────────────────────────────────────────────────────
  test:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Setup Python 3.11
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb # v5.4.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: 🧪 Run unit tests
        run: |
          uv run pytest tests/unit/ \
            --tb=short \
            --junitxml=reports/junit.xml \
            -v

      - name: 📊 Upload test results
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.0
        if: always()
        with:
          name: test-results-${{ github.run_id }}
          path: reports/junit.xml
          retention-days: 14
