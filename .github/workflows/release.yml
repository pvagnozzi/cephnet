# release.yml
# MIT License
# Author: Piergiorgio Vagnozzi
# Created: 2026-04-19
# Last modified: 2026-04-20
# Description: Release workflow — triggered on PR merge to main or dev.
#              Steps: compute version → generate changelog → build Docker images
#              → prepare synthetic dataset → train model → validate → export ONNX
#              → build release zip (models/ + reports/ + CHANGELOG.md)
#              → update README badges → commit + tag → publish GitHub Release.

name: 🚀 Release

on:
  pull_request:
    types: [closed]
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      base_ref:
        description: "Target branch (main or dev)"
        required: false
        default: "main"

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    name: 📦 Build & Publish Release
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      # ───────────────────────────────────────────
      # 1. Checkout full history (needed by GitVersion + git-cliff)
      # ───────────────────────────────────────────
      - name: 📥 Checkout (full history)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ───────────────────────────────────────────
      # 2. Compute version with GitVersion
      # ───────────────────────────────────────────
      - name: 🏷️ Install GitVersion
        uses: gittools/actions/gitversion/setup@81f0bc44e27a689ce858668d7a2081ac2387b605 # v4.0.0
        with:
          versionSpec: '6.x'

      - name: 🏷️ Determine version
        id: gitversion
        uses: gittools/actions/gitversion/execute@81f0bc44e27a689ce858668d7a2081ac2387b605 # v4.0.0
        with:
          configFilePath: GitVersion.yml

      - name: 🖨️ Print computed version
        run: |
          echo "🏷️ SemVer     = ${{ steps.gitversion.outputs.semVer }}"
          echo "🏷️ MajorMinor = ${{ steps.gitversion.outputs.majorMinorPatch }}"

      # ───────────────────────────────────────────
      # 3. Install git-cliff and generate CHANGELOG
      # ───────────────────────────────────────────
      - name: 📋 Install git-cliff
        run: |
          CLIFF_VERSION="2.7.0"
          curl -sSfL \
            "https://github.com/orhun/git-cliff/releases/download/v${CLIFF_VERSION}/git-cliff-${CLIFF_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz --strip-components=1 -C /usr/local/bin git-cliff-${CLIFF_VERSION}/git-cliff
          git-cliff --version

      - name: 📋 Generate CHANGELOG.md
        run: |
          git-cliff \
            --config .cliff.toml \
            --tag "v${{ steps.gitversion.outputs.semVer }}" \
            --output CHANGELOG.md
          echo "✅ CHANGELOG.md generated"
          head -40 CHANGELOG.md

      # ───────────────────────────────────────────
      # 4. Update pyproject.toml version
      # ───────────────────────────────────────────
      - name: 📝 Update pyproject.toml version
        run: |
          VERSION="${{ steps.gitversion.outputs.semVer }}"
          sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" pyproject.toml
          echo "✅ pyproject.toml version → ${VERSION}"

      # ───────────────────────────────────────────
      # 5. Update README.md dynamic badges & clone URL
      # ───────────────────────────────────────────
      - name: 📝 Update README.md badges
        run: |
          VERSION="${{ steps.gitversion.outputs.semVer }}"
          sed -i \
            "s|img.shields.io/badge/version-[^-]*-brightgreen|img.shields.io/badge/version-${VERSION}-brightgreen|g" \
            README.md
          echo "✅ README.md badge version → ${VERSION}"

      # ───────────────────────────────────────────
      # 6. Create artifact output directories
      # ───────────────────────────────────────────
      - name: 📂 Create artifact directories
        run: |
          mkdir -p models/checkpoints models/exports
          mkdir -p reports/metrics reports/logs reports/plots reports/verification
          mkdir -p data/raw data/interim data/processed

      # ───────────────────────────────────────────
      # 7. Build Docker images (base → cpu)
      # ───────────────────────────────────────────
      - name: 🐳 Build cephnet-base image
        run: |
          docker build \
            -f containers/base/Dockerfile \
            -t cephnet-base:latest \
            .
          echo "✅ cephnet-base:latest built"

      - name: 🐳 Build cephnet-cpu image
        run: |
          docker build \
            -f containers/cpu/Dockerfile \
            -t cephnet-cpu:latest \
            .
          echo "✅ cephnet-cpu:latest built"

      # ───────────────────────────────────────────
      # 8. Prepare synthetic dataset
      # ───────────────────────────────────────────
      - name: 📦 Prepare synthetic dataset
        run: |
          docker compose \
            -f containers/compose/docker-compose.ci.yml \
            --project-directory "${GITHUB_WORKSPACE}" \
            run --rm trainer \
            uv run python scripts/python/prepare_dataset.py \
              --config configs/training/ci.yaml \
              --synthetic \
              --n-train 60 --n-val 20 --n-test 20

      # ───────────────────────────────────────────
      # 9. Train model (2 epochs, synthetic data)
      # ───────────────────────────────────────────
      - name: 🚀 Train model
        run: |
          docker compose \
            -f containers/compose/docker-compose.ci.yml \
            --project-directory "${GITHUB_WORKSPACE}" \
            run --rm trainer \
            uv run python scripts/python/train_model.py \
              --config configs/training/ci.yaml

      # ───────────────────────────────────────────
      # 10. Validate model — generate metrics reports
      # ───────────────────────────────────────────
      - name: 🧪 Validate model
        run: |
          docker compose \
            -f containers/compose/docker-compose.ci.yml \
            --project-directory "${GITHUB_WORKSPACE}" \
            run --rm trainer \
            uv run python scripts/python/validate_model.py \
              --config configs/training/ci.yaml
        continue-on-error: true

      # ───────────────────────────────────────────
      # 11. Commit changelog + version bump
      # ───────────────────────────────────────────
      - name: 🔧 Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 💾 Commit version bump & changelog
        run: |
          VERSION="${{ steps.gitversion.outputs.semVer }}"
          git add CHANGELOG.md pyproject.toml README.md
          if git diff --cached --quiet; then
            echo "ℹ️  Nothing to commit"
          else
            git commit -m "chore(release): bump version to v${VERSION} [skip ci]"
          fi

      # ───────────────────────────────────────────
      # 12. Create and push version tag
      # ───────────────────────────────────────────
      - name: 🏷️ Create git tag
        run: |
          VERSION="${{ steps.gitversion.outputs.semVer }}"
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "ℹ️  Tag v${VERSION} already exists, skipping"
          else
            git tag -a "v${VERSION}" -m "Release v${VERSION}"
            git push origin "v${VERSION}"
            echo "✅ Tag v${VERSION} pushed"
          fi
          git push origin HEAD

      # ───────────────────────────────────────────
      # 13. Build release zip
      #    Structure:
      #      cephnet-vX.Y.Z/
      #        CHANGELOG.md
      #        models/
      #          exports/cephnet_ci.onnx   ← ONNX model
      #          checkpoints/              ← best checkpoint
      #        reports/
      #          metrics/                  ← MRE, SDR tables + HTML
      #          logs/                     ← training logs
      # ───────────────────────────────────────────
      - name: 📦 Build release zip
        run: |
          VERSION="${{ steps.gitversion.outputs.semVer }}"
          RELEASE_DIR="cephnet-v${VERSION}"

          mkdir -p "${RELEASE_DIR}/models/exports"
          mkdir -p "${RELEASE_DIR}/models/checkpoints"
          mkdir -p "${RELEASE_DIR}/reports/metrics"
          mkdir -p "${RELEASE_DIR}/reports/logs"

          cp CHANGELOG.md "${RELEASE_DIR}/"

          # Copy ONNX model(s)
          if ls models/exports/*.onnx 2>/dev/null | grep -q .; then
            cp models/exports/*.onnx "${RELEASE_DIR}/models/exports/"
            echo "✅ ONNX models included: $(ls models/exports/*.onnx)"
          else
            echo "⚠️  No ONNX models found in models/exports/"
          fi

          # Copy best checkpoint
          if ls models/checkpoints/*.pth 2>/dev/null | grep -q .; then
            cp models/checkpoints/*.pth "${RELEASE_DIR}/models/checkpoints/"
            echo "✅ Checkpoints included"
          fi

          # Copy metrics reports (CSV + HTML)
          if [ -d reports/metrics ] && [ "$(ls -A reports/metrics 2>/dev/null)" ]; then
            cp -r reports/metrics/. "${RELEASE_DIR}/reports/metrics/"
            echo "✅ Metrics reports included"
          fi

          # Copy training logs
          if [ -d reports/logs ] && [ "$(ls -A reports/logs 2>/dev/null)" ]; then
            cp -r reports/logs/. "${RELEASE_DIR}/reports/logs/"
            echo "✅ Training logs included"
          fi

          zip -r "${RELEASE_DIR}.zip" "${RELEASE_DIR}/"
          echo "✅ Release zip: ${RELEASE_DIR}.zip"
          ls -lh "${RELEASE_DIR}.zip"

      # ───────────────────────────────────────────
      # 14. Extract release notes from CHANGELOG
      # ───────────────────────────────────────────
      - name: 📋 Extract release notes
        id: release_notes
        env:
          RELEASE_VERSION: ${{ steps.gitversion.outputs.semVer }}
        run: |
          VERSION="${RELEASE_VERSION}"
          # Use awk to extract the section for this version
          awk -v ver="${VERSION}" '
            /^## / { if (index($0, ver) > 0) found=1; else if (found) exit }
            found { print }
          ' CHANGELOG.md > /tmp/release_notes.md || true

          if [ ! -s /tmp/release_notes.md ]; then
            printf '## v%s\n\nRelease %s\n' "${VERSION}" "${VERSION}" > /tmp/release_notes.md
          fi

          echo "✅ Release notes extracted:"
          head -20 /tmp/release_notes.md
          echo "notes_file=/tmp/release_notes.md" >> "$GITHUB_OUTPUT"

      # ───────────────────────────────────────────
      # 15. Publish GitHub Release
      # ───────────────────────────────────────────
      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2.2.1
        with:
          tag_name: "v${{ steps.gitversion.outputs.semVer }}"
          name: "🏷️ cephnet v${{ steps.gitversion.outputs.semVer }}"
          body_path: /tmp/release_notes.md
          draft: false
          prerelease: ${{ (github.base_ref == 'dev') || (github.event.inputs.base_ref == 'dev') }}
          files: |
            cephnet-v${{ steps.gitversion.outputs.semVer }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
