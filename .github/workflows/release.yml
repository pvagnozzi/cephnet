# release.yml
# MIT License
# Author: Piergiorgio Vagnozzi
# Created: 2026-04-19
# Last modified: 2026-04-19
# Description: Release workflow — triggered on PR merge to main or dev.
#              Steps: compute version → generate changelog → build release zip
#              (models/ + reports/ scaffolding + CHANGELOG.md) → update README
#              badges → commit + tag → publish GitHub Release.

name: 🚀 Release

on:
  pull_request:
    types: [closed]
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      base_ref:
        description: "Target branch (main or dev)"
        required: false
        default: "main"

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    name: 📦 Build & Publish Release
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      # ───────────────────────────────────────────
      # 1. Checkout full history (needed by GitVersion + git-cliff)
      # ───────────────────────────────────────────
      - name: 📥 Checkout (full history)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ───────────────────────────────────────────
      # 2. Compute version with GitVersion
      # ───────────────────────────────────────────
      - name: 🏷️ Install GitVersion
        uses: gittools/actions/gitversion/setup@81f0bc44e27a689ce858668d7a2081ac2387b605 # v4.0.0
        with:
          versionSpec: '6.x'

      - name: 🏷️ Determine version
        id: gitversion
        uses: gittools/actions/gitversion/execute@81f0bc44e27a689ce858668d7a2081ac2387b605 # v4.0.0
        with:
          configFilePath: GitVersion.yml

      - name: 🖨️ Print computed version
        run: |
          echo "🏷️ SemVer     = ${{ steps.gitversion.outputs.semVer }}"
          echo "🏷️ MajorMinor = ${{ steps.gitversion.outputs.majorMinorPatch }}"

      # ───────────────────────────────────────────
      # 3. Install git-cliff and generate CHANGELOG
      # ───────────────────────────────────────────
      - name: 📋 Install git-cliff
        run: |
          CLIFF_VERSION="2.7.0"
          curl -sSfL \
            "https://github.com/orhun/git-cliff/releases/download/v${CLIFF_VERSION}/git-cliff-${CLIFF_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz --strip-components=1 -C /usr/local/bin git-cliff-${CLIFF_VERSION}/git-cliff
          git-cliff --version

      - name: 📋 Generate CHANGELOG.md
        run: |
          git-cliff \
            --config .cliff.toml \
            --tag "v${{ steps.gitversion.outputs.semVer }}" \
            --output CHANGELOG.md
          echo "✅ CHANGELOG.md generated"
          head -40 CHANGELOG.md

      # ───────────────────────────────────────────
      # 4. Update pyproject.toml version
      # ───────────────────────────────────────────
      - name: 📝 Update pyproject.toml version
        run: |
          VERSION="${{ steps.gitversion.outputs.semVer }}"
          sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" pyproject.toml
          echo "✅ pyproject.toml version → ${VERSION}"

      # ───────────────────────────────────────────
      # 5. Update README.md dynamic badges & clone URL
      # ───────────────────────────────────────────
      - name: 📝 Update README.md badges
        run: |
          VERSION="${{ steps.gitversion.outputs.semVer }}"
          # Replace version badge value (img.shields.io/badge/version-X.Y.Z-...)
          sed -i \
            "s|img.shields.io/badge/version-[^-]*-brightgreen|img.shields.io/badge/version-${VERSION}-brightgreen|g" \
            README.md
          echo "✅ README.md badge version → ${VERSION}"

      # ───────────────────────────────────────────
      # 6. Commit changelog + version bump
      # ───────────────────────────────────────────
      - name: 🔧 Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 💾 Commit version bump & changelog
        run: |
          VERSION="${{ steps.gitversion.outputs.semVer }}"
          git add CHANGELOG.md pyproject.toml README.md
          if git diff --cached --quiet; then
            echo "ℹ️  Nothing to commit"
          else
            git commit -m "chore(release): bump version to v${VERSION} [skip ci]"
          fi

      # ───────────────────────────────────────────
      # 7. Create and push version tag
      # ───────────────────────────────────────────
      - name: 🏷️ Create git tag
        run: |
          VERSION="${{ steps.gitversion.outputs.semVer }}"
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "ℹ️  Tag v${VERSION} already exists, skipping"
          else
            git tag -a "v${VERSION}" -m "Release v${VERSION}"
            git push origin "v${VERSION}"
            echo "✅ Tag v${VERSION} pushed"
          fi
          git push origin HEAD

      # ───────────────────────────────────────────
      # 8. Build release zip
      #    Structure:
      #      cephnet-vX.Y.Z/
      #        CHANGELOG.md
      #        models/README.md
      #        reports/README.md
      # ───────────────────────────────────────────
      - name: 📦 Build release zip
        run: |
          VERSION="${{ steps.gitversion.outputs.semVer }}"
          RELEASE_DIR="cephnet-v${VERSION}"

          mkdir -p "${RELEASE_DIR}/models"
          mkdir -p "${RELEASE_DIR}/reports"

          cp CHANGELOG.md "${RELEASE_DIR}/"

          cat > "${RELEASE_DIR}/models/README.md" << 'EOF'
          # 🤖 Models

          Place your trained model artifacts here after running the training pipeline:

          | Path | Description |
          |------|-------------|
          | `checkpoints/` | Training checkpoints (`.pth`) |
          | `exports/` | Exported inference artifacts |
          | `artifacts/` | Additional model metadata |

          Run training locally:
          ```bash
          scripts/linux/run_train.sh --config configs/training/default.yaml
          # or on Windows:
          scripts\windows\run_train.ps1 -Config configs/training/default.yaml
          ```
          EOF

          cat > "${RELEASE_DIR}/reports/README.md" << 'EOF'
          # 📊 Reports

          Place your training reports here after running validation:

          | Path | Description |
          |------|-------------|
          | `metrics/` | MRE, SDR@2/2.5/3/4mm tables |
          | `plots/` | Learning curves, landmark error plots |
          | `verification/` | Cross-dataset drift analysis |
          | `logs/` | Training logs |

          Run validation locally:
          ```bash
          scripts/linux/run_validate.sh
          scripts/linux/run_verify.sh
          ```
          EOF

          zip -r "${RELEASE_DIR}.zip" "${RELEASE_DIR}/"
          echo "✅ Release zip: ${RELEASE_DIR}.zip"
          ls -lh "${RELEASE_DIR}.zip"

      # ───────────────────────────────────────────
      # 9. Extract release notes from CHANGELOG
      # ───────────────────────────────────────────
      - name: 📋 Extract release notes
        id: release_notes
        env:
          RELEASE_VERSION: ${{ steps.gitversion.outputs.semVer }}
        run: |
          python3 -c "
import re, os
version = os.environ['RELEASE_VERSION']
with open('CHANGELOG.md') as f:
    content = f.read()
# Match any section header containing the version
pattern = r'(##[^\n]*\[?' + re.escape(version) + r'\]?[^\n]*\n.*?)(?=\n##[^\n]*\[|\Z)'
match = re.search(pattern, content, re.DOTALL)
notes = match.group(1).strip() if match else f'## v{version}\n\nRelease {version}'
with open('/tmp/release_notes.md', 'w') as f:
    f.write(notes)
print('Release notes extracted:')
print(notes[:500])
"
          echo "notes_file=/tmp/release_notes.md" >> "$GITHUB_OUTPUT"

      # ───────────────────────────────────────────
      # 10. Publish GitHub Release
      # ───────────────────────────────────────────
      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2.2.1
        with:
          tag_name: "v${{ steps.gitversion.outputs.semVer }}"
          name: "🏷️ cephnet v${{ steps.gitversion.outputs.semVer }}"
          body_path: /tmp/release_notes.md
          draft: false
          prerelease: ${{ (github.base_ref == 'dev') || (github.event.inputs.base_ref == 'dev') }}
          files: |
            cephnet-v${{ steps.gitversion.outputs.semVer }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
