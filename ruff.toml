target-version = "py311"
line-length = 100
src = ["src", "tests", "scripts/python"]

[lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "PT", "RET", "SIM"]
ignore = [
    # ML/DL conventions: B=batch, N=landmarks, H=height, W=width are standard uppercase
    "N806",
    # torch.nn.functional as F and albumentations as A are accepted PyTorch/CV idioms
    "N812",
]

[lint.isort]
known-first-party = ["cephnet"]
