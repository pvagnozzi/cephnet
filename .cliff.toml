# Last modified: 2026-04-19
# Description: git-cliff configuration for changelog generation with emoji.

[changelog]
header = """# 📋 Changelog

All notable changes to **cephnet** are documented here.
Format based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/)
and [Conventional Commits](https://www.conventionalcommits.org/).

---
"""

body = """
{% if version %}\
## 🏷️ [{{ version | trim_start_matches(pat="v") }}] — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## 🚧 [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}
- {{ commit.message | upper_first }} \
([`{{ commit.id | truncate(length=7, end="") }}`](https://github.com/pvagnozzi/cephnet/commit/{{ commit.id }}))\
{% if commit.author.name %} — *{{ commit.author.name }}*{% endif %}
{% endfor %}
{% endfor %}\n
"""

footer = """
---

> 🤖 Generated by [git-cliff](https://git-cliff.org/)
"""

trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = false

commit_parsers = [
  { message = "^feat",     group = "✨ Features"       },
  { message = "^fix",      group = "🐛 Bug Fixes"      },
  { message = "^perf",     group = "⚡ Performance"    },
  { message = "^refactor", group = "🔧 Refactoring"    },
  { message = "^docs",     group = "📚 Documentation"  },
  { message = "^test",     group = "🧪 Tests"          },
  { message = "^ci",       group = "🔄 CI/CD"          },
  { message = "^build",    group = "📦 Build System"   },
  { message = "^chore",    group = "🏠 Chores"         },
  { message = "^style",    group = "🎨 Style"          },
  { message = ".*",        group = "🔀 Other"          },
]

filter_commits = false
tag_pattern = "v[0-9].*"
topo_order = false
sort_commits = "oldest"
