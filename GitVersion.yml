# Description: GitVersion configuration for GitFlow branching strategy.
#              dev branch is treated as develop; main is the production branch.

workflow: GitFlow/v1

branches:
  develop:
    regex: '^dev(elop)?$'
  feature:
    regex: '^(feature|feat)[/-].*'
  release:
    regex: '^release[/-].*'
  hotfix:
    regex: '^hotfix[/-].*'

assembly-versioning-scheme: MajorMinorPatch
assembly-file-versioning-scheme: MajorMinorPatchTag
tag-prefix: 'v'

major-version-bump-message: '^(feat|fix|refactor|perf).*\n\nBREAKING CHANGE'
minor-version-bump-message: '^feat(\(.*\))?!?:'
patch-version-bump-message: '^(fix|perf|refactor)(\(.*\))?:'
no-bump-message: '^(docs|chore|ci|test|style|build)(\(.*\))?:'

commit-message-incrementing: Enabled
